<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex - Consumo de API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <header class="pokedex-header">
        <div class="container py-4">
            <div class="d-flex align-items-center gap-3">
                <span class="pokedex-lente" aria-hidden="true"></span>
                <div>
                    <h1 class="mb-0">Pokédex</h1>
                    <p class="mb-0 pokedex-subtitulo">Los primeros pokémon, directo desde la PokéAPI</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4">

        <!-- Spinner de carga -->
        <div id="spinner-carga" class="text-center py-5">
            <div class="spinner-border" role="status" style="color:#DC0A2D;">
                <span class="visually-hidden">Cargando…</span>
            </div>
            <p class="mt-3 text-muted">Buscando pokémon…</p>
        </div>

        <!-- Mensaje de error -->
        <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>

        <!-- Grilla de cartas -->
        <div id="grilla-pokemon" class="row g-3"></div>

        <!-- Botón para cargar más pokémon -->
        <div class="text-center my-4">
            <button id="btn-cargar-mas" class="btn btn-lg pokedex-btn-primario d-none">
                Ver más pokémon
            </button>
            <div id="spinner-cargar-mas" class="spinner-border spinner-border-sm d-none" style="color:#DC0A2D;" role="status">
                <span class="visually-hidden">Cargando…</span>
            </div>
        </div>

    </main>

    <!-- Modal con el detalle del pokémon -->
    <div class="modal fade" id="modal-pokemon" tabindex="-1" aria-labelledby="modal-pokemon-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-pokemon-titulo">Nombre del pokémon</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-3">
                        <img id="modal-pokemon-imagen" src="" alt="" class="modal-pokemon-imagen">
                    </div>

                    <div class="mb-3">
                        <h6 class="detalle-etiqueta">Tipos</h6>
                        <div id="modal-pokemon-tipos" class="d-flex flex-wrap gap-2"></div>
                    </div>

                    <div class="mb-3">
                        <h6 class="detalle-etiqueta">Habilidades</h6>
                        <ul id="modal-pokemon-habilidades" class="mb-0"></ul>
                    </div>

                    <div>
                        <h6 class="detalle-etiqueta">Algunos movimientos</h6>
                        <ul id="modal-pokemon-movimientos" class="mb-0"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
