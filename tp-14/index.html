<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        #lista-contactos {
            list-style: none;
            padding-left: 0;
        }
        #lista-contactos li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        #lista-contactos li .info-contacto {
            flex-grow: 1;
        }
        #lista-contactos li .telefono-contacto {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .btn-favorito {
            background: none;
            border: none;
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
        }
        .btn-favorito.activo {
            color: #ffc107;
        }
        .btn-favorito:not(.activo) {
            color: #ced4da;
        }
        .btn-ordenar.activo {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Contactos</h1>
        <div class="card">
            <div class="card-body">
                <h2>Contactos</h2>

                <div class="d-flex flex-wrap gap-2 mb-3">
                    <div class="btn-group" role="group" aria-label="Ordenar contactos">
                        <button type="button" id="btn-ordenar-nombre" class="btn btn-outline-secondary btn-sm btn-ordenar activo" data-campo="nombre">
                            Ordenar por nombre
                        </button>
                        <button type="button" id="btn-ordenar-apellido" class="btn btn-outline-secondary btn-sm btn-ordenar" data-campo="apellido">
                            Ordenar por apellido
                        </button>
                    </div>
                    <button type="button" id="btn-toggle-favoritos" class="btn btn-outline-warning btn-sm">
                        Ver sólo favoritos
                    </button>
                </div>

                <ul id="lista-contactos"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="nombre" id="input-nombre" placeholder="Nombre" aria-label="Nombre">
                        <input type="text" class="form-control" name="apellido" id="input-apellido" placeholder="Apellido" aria-label="Apellido">
                        <input type="tel" class="form-control" name="telefono" id="input-telefono" placeholder="Teléfono" aria-label="Teléfono">
                    </div>
                    <button class="btn btn-primary" type="submit">Agregar Contacto</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '',
                favorito: false,
            },
        ];

        // Estado de la vista: por qué campo se ordena y si se muestran sólo favoritos
        let campoOrden = 'nombre';
        let mostrarSoloFavoritos = false;

        const listaContactosEl = document.getElementById('lista-contactos');

        /**
         * agregarContacto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nuevo contacto para agregar.
         */
        function agregarContacto(nombre, apellido, telefono) {
            const nombreLimpio = nombre.trim();
            const apellidoLimpio = apellido.trim();
            if (nombreLimpio === '' && apellidoLimpio === '') {
                return;
            }
            contactos.push({
                nombre: nombreLimpio,
                apellido: apellidoLimpio,
                telefono: (telefono || '').trim(),
                favorito: false,
            });
            mostrarListado();
        }

        function eliminarContacto(indice) {
            contactos.splice(indice, 1);
            mostrarListado();
        }

        function alternarFavorito(indice) {
            contactos[indice].favorito = !contactos[indice].favorito;
            mostrarListado();
        }

        function cambiarOrden(campo) {
            campoOrden = campo;
            document.querySelectorAll('.btn-ordenar').forEach((boton) => {
                boton.classList.toggle('activo', boton.dataset.campo === campo);
            });
            mostrarListado();
        }

        function alternarFiltroFavoritos() {
            mostrarSoloFavoritos = !mostrarSoloFavoritos;
            const boton = document.getElementById('btn-toggle-favoritos');
            boton.textContent = mostrarSoloFavoritos ? 'Ver todos los contactos' : 'Ver sólo favoritos';
            boton.classList.toggle('btn-warning', mostrarSoloFavoritos);
            boton.classList.toggle('btn-outline-warning', !mostrarSoloFavoritos);
            mostrarListado();
        }

        /**
         * mostrarListado()
         * esta función se encarga de mostrar en el DOM la lista de todos los contactos guardados en la variable global contactos.
         */
        function mostrarListado() {
            // Se ordena una copia del array por el campo elegido (nombre o apellido)
            let contactosAMostrar = [...contactos].sort((a, b) =>
                a[campoOrden].localeCompare(b[campoOrden])
            );

            if (mostrarSoloFavoritos) {
                contactosAMostrar = contactosAMostrar.filter((contacto) => contacto.favorito);
            }

            listaContactosEl.innerHTML = '';

            if (contactosAMostrar.length === 0) {
                const liVacio = document.createElement('li');
                liVacio.textContent = mostrarSoloFavoritos
                    ? 'No hay contactos favoritos todavía.'
                    : 'No hay contactos cargados.';
                liVacio.classList.add('text-muted');
                listaContactosEl.appendChild(liVacio);
                return;
            }

            contactosAMostrar.forEach((contacto) => {
                // Se busca el índice real en el array original (no en la copia ordenada/filtrada)
                // para que eliminar y marcar favorito afecten al contacto correcto.
                const indiceReal = contactos.indexOf(contacto);

                const li = document.createElement('li');

                const btnFavorito = document.createElement('button');
                btnFavorito.type = 'button';
                btnFavorito.className = 'btn-favorito' + (contacto.favorito ? ' activo' : '');
                btnFavorito.title = contacto.favorito ? 'Quitar de favoritos' : 'Marcar como favorito';
                btnFavorito.textContent = contacto.favorito ? '★' : '☆';
                btnFavorito.addEventListener('click', () => alternarFavorito(indiceReal));

                const infoDiv = document.createElement('div');
                infoDiv.className = 'info-contacto';

                const nombreSpan = document.createElement('div');
                nombreSpan.textContent = `${contacto.nombre} ${contacto.apellido}`.trim();

                infoDiv.appendChild(nombreSpan);

                if (contacto.telefono) {
                    const telefonoSpan = document.createElement('div');
                    telefonoSpan.className = 'telefono-contacto';
                    telefonoSpan.textContent = contacto.telefono;
                    infoDiv.appendChild(telefonoSpan);
                }

                const btnEliminar = document.createElement('button');
                btnEliminar.type = 'button';
                btnEliminar.className = 'btn btn-sm btn-outline-danger';
                btnEliminar.textContent = 'Eliminar';
                btnEliminar.addEventListener('click', () => eliminarContacto(indiceReal));

                li.appendChild(btnFavorito);
                li.appendChild(infoDiv);
                li.appendChild(btnEliminar);
                listaContactosEl.appendChild(li);
            });
        }

        function handlerFormulario(e) {
            e.preventDefault();
            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;

            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";

            agregarContacto(nombre, apellido, telefono);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);
        document.getElementById('btn-ordenar-nombre').addEventListener('click', () => cambiarOrden('nombre'));
        document.getElementById('btn-ordenar-apellido').addEventListener('click', () => cambiarOrden('apellido'));
        document.getElementById('btn-toggle-favoritos').addEventListener('click', alternarFiltroFavoritos);

        // Muestra el listado inicial (el contacto "Juan Perez" que viene precargado)
        mostrarListado();
    </script>
</body>
</html>
