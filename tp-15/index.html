<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

</head>
<body id="cuerpoPagina">
    
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
    	<h1>Tablero de Puntos</h1>
        <div class="card">
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-5">
                        <span class="display-1" id="puntolocal">0</span>
                        <p class="m-0" id="nombreLocalDisplay">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span class="display-1" id="puntovisitante">0</span>
                        <p class="m-0" id="nombreVisitanteDisplay">Visitante</p>
                    </div>
                </div>

                <hr class="hr">

                <h2>Actualizar Contador</h2>
                <div class="row">
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-primary" id="botonLocal">
                            Sumar Punto Local
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-primary" id="botonVisitante">
                            Sumar Punto Visitante
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-danger" id="botonReinicio">
                            Reinicio
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-secondary" id="botonRLocal">
                             Restar Punto Local
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-secondary" id="botonRVisitante">
                             Restar Punto Visitante
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button class="btn w-100 btn-warning text-dark fw-bold" id="botonFinalizar">
                            Finalizar Partido
                        </button>
                    </div>
                </div>
                <!-- Bonus Tracks: Personalización -->
                <h2 class="h4">Personalización</h2>
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="inputLocal" class="form-label">Nombre Equipo Local</label>
                        <input type="text" class="form-control" id="inputLocal" value="Local">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="inputVisitante" class="form-label">Nombre Equipo Visitante</label>
                        <input type="text" class="form-control" id="inputVisitante" value="Visitante">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="colorFondo" class="form-label">Color Fondo de Página</label>
                        <input type="color" class="form-control form-control-color w-100" id="colorFondo" value="#f8f9fa">
                    </div>
                </div>
            </div>
        </div>
    </div>
      <script>
        // Declaramos las variables
        let puntajelocal = 0;
        let puntajevisitante = 0;
        let partidoFinalizado = false;
        const botonesPuntaje = document.querySelectorAll(".btn-score, #botonLocal, #botonVisitante, #botonRLocal, #botonRVisitante");
        //Sumar puntaje local
        document.querySelector("#botonLocal").addEventListener('click', sumarLocal);

        function sumarLocal(){
             puntajelocal = puntajelocal + 1;
            document.querySelector("#puntolocal").innerText = puntajelocal;     
        }

        //Sumar puntaje visitante
        document.querySelector("#botonVisitante").addEventListener('click', sumarVisitante);

        function sumarVisitante(){
            puntajevisitante++;
            document.querySelector("#puntovisitante").innerText = puntajevisitante;
        }

        //Reiniciar Puntajes
        document.querySelector("#botonReinicio").addEventListener('click', reiniciar);

        function reiniciar(){
            puntajelocal = 0;
            puntajevisitante = 0;

            document.querySelector("#puntovisitante").innerText = puntajevisitante;
            document.querySelector("#puntolocal").innerText = puntajelocal;       
            
            //Habilitar los botones
            botonesPuntaje.forEach(btn => btn.disabled = false);
            botonFinalizar.disabled = false;
        }
        // Restar puntos local
        document.querySelector("#botonRLocal").addEventListener('click', restarLocal);

        function restarLocal(){
            puntajelocal--;
            document.querySelector("#puntolocal").innerText = puntajelocal;
        }
        // Restar puntos visitante
        document.querySelector("#botonRVisitante").addEventListener('click', restarVisitante);

        function restarVisitante(){
            puntajevisitante--;
            document.querySelector("#puntovisitante").innerText = puntajevisitante;
        }

        //Finalizar partido
        document.querySelector("#botonFinalizar").addEventListener('click', finalizarPartido);

        function finalizarPartido() {
            partidoFinalizado = true;
            botonesPuntaje.forEach(btn => btn.disabled = true);
            botonFinalizar.disabled = true;
        }

        // BONUS TRACK 1: Nombres dinámicos
        const inputLocal = document.querySelector("#inputLocal");
        const inputVisitante = document.querySelector("#inputVisitante");
        const displayLocal = document.querySelector("#nombreLocalDisplay");
        const displayVisitante = document.querySelector("#nombreVisitanteDisplay");

        inputLocal.addEventListener('input', (e) => {
            displayLocal.innerText = e.target.value.trim() || 'Local';
        });

        inputVisitante.addEventListener('input', (e) => {
            displayVisitante.innerText = e.target.value.trim() || 'Visitante';
        });

         // BONUS TRACK 2: Color de fondo
        document.querySelector("#colorFondo").addEventListener('input', (e) => {
            document.querySelector("#cuerpoPagina").style.backgroundColor = e.target.value;
        });

        // BONUS TRACK 3: Atajos de teclado
        document.addEventListener('keydown', (e) => {
            // Ignorar atajos si el usuario está escribiendo en los inputs
            if (e.target.tagName === 'INPUT') return;

            const tecla = e.key.toLowerCase();
            if (tecla === 'a') sumarLocal();
            if (tecla === 'l') sumarVisitante();
            if (tecla === 'z') restarLocal();
            if (tecla === 'm') restarVisitante();
            if (tecla === 'r') reiniciar();
        });
        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
