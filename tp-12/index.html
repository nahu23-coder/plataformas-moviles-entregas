<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        .btn-formato-activo {
            box-shadow: inset 0 0 0 3px #0d6efd;
            background-color: #0a58ca;
            border-color: #0a58ca;
        }
        #texto {
            transition: color 0.15s ease, font-size 0.15s ease;
        }
    </style>
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card">
            <div class="card-body">
                <h2>Texto</h2>

                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>

                <div class="mb-3">
                    <label for="input-texto" class="form-label">Editar texto</label>
                    <input type="text" class="form-control" id="input-texto" placeholder="Escribí el nuevo texto acá...">
                </div>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row">
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-negrita" class="btn d-block w-100 btn-primary" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-primary" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-subrayado" class="btn d-block w-100 btn-primary" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>
                    <div class="col-12 col-md-4 my-1">
                        <button id="btn-color" class="btn d-block w-100 btn-primary" data-formato="color">
                            Color de Texto
                        </button>
                    </div>
                </div>

                <hr class="hr">

                <h2>Tamaño del Texto</h2>
                <div class="row align-items-center">
                    <div class="col-4 col-md-2 my-1">
                        <button id="btn-tamano-menos" class="btn d-block w-100 btn-secondary">−</button>
                    </div>
                    <div class="col-4 col-md-2 my-1 text-center">
                        <span id="tamano-actual">16px</span>
                    </div>
                    <div class="col-4 col-md-2 my-1">
                        <button id="btn-tamano-mas" class="btn d-block w-100 btn-secondary">+</button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-tamano-reset" class="btn d-block w-100 btn-outline-secondary">Restablecer tamaño</button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-reset-todo" class="btn d-block w-100 btn-outline-danger">Restablecer todo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const texto = document.getElementById('texto');
        const TAMANO_BASE = 16; // px
        const TAMANO_PASO = 2;  // px por click
        const TAMANO_MIN = 8;
        const TAMANO_MAX = 48;

        const coloresDisponibles = ['#212529', '#dc3545', '#198754', '#0d6efd', '#fd7e14', '#6f42c1'];
        let indiceColorActual = 0;

        let tamanoActual = TAMANO_BASE;

        /**
         * Actualiza el aspecto del botón (activo/inactivo) según el estado del estilo.
         */
        function actualizarEstadoBoton(idBoton, activo) {
            const boton = document.getElementById(idBoton);
            if (!boton) return;
            boton.classList.toggle('btn-formato-activo', activo);
        }

        /**
         * funcionNegrita()
         * Esta función se ejecuta cuando el usuario selecciona la opción Bold (negrita).
         */
        function funcionNegrita() {
            const activo = texto.classList.toggle('fw-bold');
            actualizarEstadoBoton('btn-negrita', activo);
        }

        /**
         * funcionCursiva()
         * Esta función se ejecuta cuando el usuario selecciona la opción Italic (cursiva).
         */
        function funcionCursiva() {
            const activo = texto.classList.toggle('fst-italic');
            actualizarEstadoBoton('btn-cursiva', activo);
        }

        /**
         * funcionSubrayado()
         * Esta función se ejecuta cuando el usuario selecciona la opción Underline (subrayado).
         */
        function funcionSubrayado() {
            const activo = texto.classList.toggle('text-decoration-underline');
            actualizarEstadoBoton('btn-subrayado', activo);
        }

        /**
         * funcionColor()
         * Estilo adicional: recorre una paleta de colores y la aplica al texto.
         */
        function funcionColor() {
            indiceColorActual = (indiceColorActual + 1) % coloresDisponibles.length;
            texto.style.color = coloresDisponibles[indiceColorActual];
            // El estilo "color" siempre queda activo salvo que esté en el primer color (por defecto)
            actualizarEstadoBoton('btn-color', indiceColorActual !== 0);
        }

        /**
         * Cambia el tamaño de fuente del texto sumando/restando 'delta' px,
         * respetando los límites mínimo y máximo.
         */
        function cambiarTamano(delta) {
            tamanoActual = Math.min(TAMANO_MAX, Math.max(TAMANO_MIN, tamanoActual + delta));
            texto.style.fontSize = tamanoActual + 'px';
            document.getElementById('tamano-actual').textContent = tamanoActual + 'px';
        }

        function resetearTamano() {
            tamanoActual = TAMANO_BASE;
            texto.style.fontSize = tamanoActual + 'px';
            document.getElementById('tamano-actual').textContent = tamanoActual + 'px';
        }

        function resetearTodo() {
            texto.classList.remove('fw-bold', 'fst-italic', 'text-decoration-underline');
            texto.style.color = '';
            indiceColorActual = 0;
            resetearTamano();
            ['btn-negrita', 'btn-cursiva', 'btn-subrayado', 'btn-color'].forEach(id => actualizarEstadoBoton(id, false));
            document.getElementById('input-texto').value = '';
        }

        function handlerBoton(e) {
            // Obtiene el valor del atributo "data-formato" del botón que disparó el evento
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }
        document.querySelectorAll('button.btn[data-formato]').forEach(e => e.addEventListener('click', handlerBoton));

        // Input para editar el texto en tiempo real
        document.getElementById('input-texto').addEventListener('input', (e) => {
            texto.textContent = e.target.value.trim() === '' ? texto.dataset.original : e.target.value;
        });
        texto.dataset.original = texto.textContent;

        // Controles de tamaño de fuente
        document.getElementById('btn-tamano-mas').addEventListener('click', () => cambiarTamano(TAMANO_PASO));
        document.getElementById('btn-tamano-menos').addEventListener('click', () => cambiarTamano(-TAMANO_PASO));
        document.getElementById('btn-tamano-reset').addEventListener('click', resetearTamano);

        // Bonus: restablecer todos los estilos de una vez
        document.getElementById('btn-reset-todo').addEventListener('click', resetearTodo);
    </script>
</body>
</html>
