<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        .producto-comprado {
            text-decoration: line-through;
            color: #6c757d;
        }
        #lista-productos {
            list-style: none;
            padding-left: 0;
        }
        #lista-productos li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid #eee;
        }
        #lista-productos li .nombre-producto {
            flex-grow: 1;
        }
        #lista-productos li input.editar-input {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <div class="d-flex gap-2 flex-wrap mb-2">
                    <button id="btn-ordenar" class="btn btn-outline-secondary btn-sm">Ordenar alfabéticamente</button>
                    <button id="btn-limpiar" class="btn btn-outline-danger btn-sm">Limpiar lista</button>
                </div>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const CLAVE_LOCAL_STORAGE = 'tp13-lista-productos';
        const listaProductosEl = document.getElementById('lista-productos');

        /**
         * Estado de la aplicación: una lista de productos, donde cada producto es
         * un objeto { id, nombre, comprado }.
         * Si hay datos guardados en localStorage, se cargan de ahí. Si no, se usa
         * el producto "Pan" que venía en el HTML inicial como semilla.
         */
        let productos = cargarProductos();

        function cargarProductos() {
            const guardado = localStorage.getItem(CLAVE_LOCAL_STORAGE);
            if (guardado) {
                try {
                    return JSON.parse(guardado);
                } catch (error) {
                    console.warn('No se pudo leer la lista guardada, se reinicia.', error);
                }
            }
            return [{ id: generarId(), nombre: 'Pan', comprado: false }];
        }

        function guardarProductos() {
            localStorage.setItem(CLAVE_LOCAL_STORAGE, JSON.stringify(productos));
        }

        function generarId() {
            return Date.now() + Math.random().toString(16).slice(2);
        }

        /**
         * Dibuja la lista de productos completa en el DOM a partir del array `productos`.
         */
        function renderizarLista() {
            listaProductosEl.innerHTML = '';

            productos.forEach((producto) => {
                const li = document.createElement('li');
                li.dataset.id = producto.id;

                // Checkbox para marcar como comprado
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'form-check-input mt-0';
                checkbox.checked = producto.comprado;
                checkbox.addEventListener('change', () => alternarComprado(producto.id));

                // Nombre del producto (editable con doble click)
                const nombreSpan = document.createElement('span');
                nombreSpan.className = 'nombre-producto' + (producto.comprado ? ' producto-comprado' : '');
                nombreSpan.textContent = producto.nombre;
                nombreSpan.title = 'Doble click para editar';
                nombreSpan.addEventListener('dblclick', () => habilitarEdicion(producto.id));

                // Botón eliminar
                const btnEliminar = document.createElement('button');
                btnEliminar.type = 'button';
                btnEliminar.className = 'btn btn-sm btn-outline-danger';
                btnEliminar.textContent = 'Eliminar';
                btnEliminar.addEventListener('click', () => eliminarProducto(producto.id));

                li.appendChild(checkbox);
                li.appendChild(nombreSpan);
                li.appendChild(btnEliminar);
                listaProductosEl.appendChild(li);
            });
        }

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {
            const nombreLimpio = nombreProducto.trim();
            if (nombreLimpio === '') {
                return;
            }
            productos.push({ id: generarId(), nombre: nombreLimpio, comprado: false });
            guardarProductos();
            renderizarLista();
        }

        function eliminarProducto(id) {
            productos = productos.filter((producto) => producto.id !== id);
            guardarProductos();
            renderizarLista();
        }

        function limpiarLista() {
            productos = [];
            guardarProductos();
            renderizarLista();
        }

        function ordenarAlfabeticamente() {
            productos.sort((a, b) => a.nombre.localeCompare(b.nombre));
            guardarProductos();
            renderizarLista();
        }

        function alternarComprado(id) {
            const producto = productos.find((producto) => producto.id === id);
            if (!producto) return;
            producto.comprado = !producto.comprado;
            guardarProductos();
            renderizarLista();
        }

        /**
         * Reemplaza el <span> del nombre por un <input> para poder editarlo.
         * Al confirmar (Enter o blur) se guarda el nuevo nombre; con Escape se cancela.
         */
        function habilitarEdicion(id) {
            const producto = productos.find((producto) => producto.id === id);
            if (!producto) return;

            const li = listaProductosEl.querySelector(`li[data-id="${id}"]`);
            const nombreSpan = li.querySelector('.nombre-producto');

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-control form-control-sm editar-input';
            input.value = producto.nombre;

            const confirmarEdicion = () => {
                const nuevoNombre = input.value.trim();
                producto.nombre = nuevoNombre === '' ? producto.nombre : nuevoNombre;
                guardarProductos();
                renderizarLista();
            };

            input.addEventListener('keydown', (evento) => {
                if (evento.key === 'Enter') {
                    confirmarEdicion();
                } else if (evento.key === 'Escape') {
                    renderizarLista();
                }
            });
            input.addEventListener('blur', confirmarEdicion);

            li.replaceChild(input, nombreSpan);
            input.focus();
            input.select();
        }

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);
        document.getElementById('btn-ordenar').addEventListener('click', ordenarAlfabeticamente);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarLista);

        // Dibuja el estado inicial (desde localStorage o el producto semilla "Pan")
        renderizarLista();
    </script>
</body>
</html>
